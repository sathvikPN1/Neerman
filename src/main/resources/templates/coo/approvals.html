<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Screen 08 of the design handoff: the COO's approval list. Tap a claim to open it and decide. -->
<head th:replace="~{fragments/shell :: head('Approvals')}"></head>
<body th:replace="~{fragments/shell :: page('approvals', ~{::#content})}">
<div id="content" style="display:contents">
    <div class="page-head">
        <div><h1 class="page-title">Approvals</h1>
            <span style="font-size:15px"><th:block th:text="${count} + ' waiting · '">3 waiting · </th:block><b class="mono" style="font-weight:500" th:text="${@fmt.inr(total)}">₹95,949.00</b></span></div>
        <a sec:authorize="hasAnyAuthority('CLAIM_VERIFY','CLAIM_RETURN_REJECT')" th:href="@{/staff/queue}" style="font-size:14px">Full staff queue →</a>
    </div>

    <div th:if="${count == 0}" class="list"><div class="empty"><b>All caught up.</b><span class="muted-sm">Verified claims appear here, priority first.</span></div></div>

    <!-- Bulk approval: tick claims below, then approve them in full together. -->
    <form id="bulk-form" th:action="@{/coo/approvals/bulk}" method="post" th:if="${count > 0}"
          style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#fff;border:1px solid var(--color-divider);position:sticky;top:0;z-index:10"
          onsubmit="return confirm('Approve all selected claims in full?')">
        <label class="check" style="align-items:center"><input type="checkbox" data-select-all="selected">Select all</label>
        <button class="btn btn-primary" style="min-height:40px"><i class="icon-check-check" aria-hidden="true"></i>Approve selected</button>
    </form>

    <div style="display:flex;flex-direction:column;gap:10px">
        <th:block th:each="a : ${priorityRows}"><div th:replace="~{coo/fragments :: row(${a})}"></div></th:block>
        <th:block th:each="a : ${otherRows}"><div th:replace="~{coo/fragments :: row(${a})}"></div></th:block>
    </div>
    <p class="hint" th:if="${count > 0}">Claims you verified yourself, or that exceed the team budget, can't be bulk-approved. Open them to decide.</p>
</div>
</body>
</html>
