<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Budget meter: paid (dark), approved (green), pending (striped amber), remaining (grey). -->
<section th:fragment="meter(budget, title)" class="card p-4" aria-labelledby="budget-title">
    <div class="flex items-baseline justify-between gap-2">
        <h2 id="budget-title" class="font-semibold" th:text="${title}">Budget</h2>
        <span class="text-sm text-slate-600">Total <strong class="text-slate-900" th:text="${@fmt.inr(budget.total())}">₹2,00,000.00</strong></span>
    </div>
    <div class="mt-3 h-3 w-full rounded-full bg-slate-200 overflow-hidden flex" aria-hidden="true">
        <div class="bg-green-700" th:style="'width:' + ${budget.paidPercent()} + '%'"></div>
        <div class="bg-emerald-400" th:style="'width:' + ${budget.approvedPercent()} + '%'"></div>
        <div class="bg-amber-300" th:style="'width:' + ${budget.pendingPercent()} + '%'"></div>
    </div>
    <dl class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
        <div><dt class="text-slate-600 flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-green-700"></span>Paid</dt><dd class="font-semibold" th:text="${@fmt.inr(budget.paid())}"></dd></div>
        <div><dt class="text-slate-600 flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-emerald-400"></span>Approved, unpaid</dt><dd class="font-semibold" th:text="${@fmt.inr(budget.approved())}"></dd></div>
        <div><dt class="text-slate-600 flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-amber-300"></span>Pending review</dt><dd class="font-semibold" th:text="${@fmt.inr(budget.pending())}"></dd></div>
        <div><dt class="text-slate-600 flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-slate-300"></span>Remaining</dt>
            <dd class="font-semibold" th:classappend="${budget.remaining().signum() < 0} ? 'text-rose-700'" th:text="${@fmt.inr(budget.remaining())}"></dd></div>
    </dl>
</section>
</body>
</html>
