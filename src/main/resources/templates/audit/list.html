<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main" class="max-w-6xl mx-auto px-4 py-6 space-y-4">
    <h1 class="text-2xl font-semibold">Audit log</h1>
    <form method="get" class="card p-3 flex flex-wrap gap-2 items-end">
        <div><label class="label" for="entityType">Entity</label>
            <select class="input" id="entityType" name="entityType"><option value="">All</option>
                <option th:each="e : ${entityTypes}" th:value="${e}" th:text="${e}" th:selected="${entityType == e.name()}"></option></select></div>
        <div><label class="label" for="action">Action</label><input class="input" id="action" name="action" th:value="${action}" placeholder="e.g. APPROVED"></div>
        <button class="btn btn-primary">Filter</button>
    </form>
    <div class="card overflow-x-auto">
        <table class="table w-full text-sm">
            <thead><tr><th>When (IST)</th><th>Who</th><th>Action</th><th>Entity</th><th>Change</th><th>Detail</th></tr></thead>
            <tbody>
            <tr th:if="${page.isEmpty()}"><td colspan="6" class="text-center text-slate-500 py-8">No entries.</td></tr>
            <tr th:each="e : ${page.content}">
                <td class="whitespace-nowrap" th:text="${@fmt.dateTime(e.createdAt())}"></td>
                <td><span th:text="${e.actorName()}"></span><div th:if="${e.onBehalfOfName() != null}" class="text-xs text-slate-500" th:text="'on behalf of ' + ${e.onBehalfOfName()}"></div>
                    <div th:if="${e.permissionUsed() != null}" class="text-xs text-slate-500 font-mono" th:text="${e.permissionUsed()}"></div></td>
                <td class="font-mono text-xs" th:text="${e.action()}"></td>
                <td><a th:if="${e.entityType() == 'CLAIM'}" class="text-indigo-700 underline" th:href="@{/claims/{id}(id=${e.entityId()})}" th:text="'Claim #' + ${e.entityId()}"></a>
                    <span th:unless="${e.entityType() == 'CLAIM'}" th:text="${e.entityType()} + (${e.entityId() != null} ? ' #' + ${e.entityId()} : '')"></span></td>
                <td class="text-xs" th:text="${e.fromState() != null or e.toState() != null} ? ${e.fromState() ?: '∅'} + ' → ' + ${e.toState()} : ''"></td>
                <td class="text-xs text-slate-600 break-all" th:text="${e.detail()}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav class="flex justify-between" aria-label="Pagination">
        <a th:if="${page.hasPrevious()}" class="btn btn-ghost" th:href="@{/audit(page=${page.number - 1},entityType=${entityType},action=${action})}">← Newer</a><span></span>
        <a th:if="${page.hasNext()}" class="btn btn-ghost" th:href="@{/audit(page=${page.number + 1},entityType=${entityType},action=${action})}">Older →</a>
    </nav>
</main>
</body>
</html>
