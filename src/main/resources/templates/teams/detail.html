<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${team.summary().name()})}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main" class="max-w-6xl mx-auto px-4 py-6 space-y-6" th:with="t=${team.summary()}">
    <div th:replace="~{fragments/flash :: flash}"></div>
    <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-semibold"><span th:text="${t.name()}"></span>
                <th:block th:if="${t.priority()}"><span th:replace="~{fragments/layout :: priority}"></span></th:block></h1>
            <p class="text-sm text-slate-600" th:text="${t.program().label()} + ' · ' + ${t.cohortName()}"></p>
            <p th:if="${t.priority()}" class="text-sm text-rose-800" th:text="'Priority: ' + ${t.priorityReason()}"></p>
        </div>
        <a sec:authorize="hasAuthority('TEAM_MANAGE')" th:href="@{/teams/{id}/edit(id=${t.id()})}" class="btn btn-ghost">Edit team &amp; budget</a>
    </div>

    <div th:replace="~{fragments/budget :: meter(${t.budget()}, 'Budget')}"></div>

    <div class="grid lg:grid-cols-2 gap-6">
        <section class="card p-4 space-y-3" aria-labelledby="members-title">
            <h2 id="members-title" class="font-semibold">Members</h2>
            <p th:if="${team.members().isEmpty()}" class="text-sm text-slate-500">No members yet.</p>
            <ul class="divide-y text-sm">
                <li th:each="m : ${team.members()}" class="py-2 flex items-center justify-between gap-2">
                    <div><p class="font-medium" th:text="${m.name()}"></p><p class="text-xs text-slate-500" th:text="${m.email()}"></p>
                        <span th:if="${m.invitePending()}" class="chip bg-sky-100 text-sky-800">Invite pending</span>
                        <span th:unless="${m.active()}" class="chip bg-slate-200">Deactivated</span></div>
                    <form sec:authorize="hasAuthority('TEAM_MANAGE')" th:if="${m.active()}" th:action="@{/teams/{t}/members/{u}/remove(t=${t.id()},u=${m.userId()})}" method="post"
                          onsubmit="return confirm('Remove this member and deactivate their account?')">
                        <button class="text-xs text-rose-700 underline">Remove</button>
                    </form>
                </li>
            </ul>
            <form sec:authorize="hasAuthority('TEAM_MANAGE')" th:action="@{/teams/{id}/members(id=${t.id()})}" method="post" class="grid sm:grid-cols-3 gap-2 items-end border-t pt-3">
                <div><label class="label" for="mname">Name</label><input class="input" id="mname" name="name" required></div>
                <div><label class="label" for="memail">Email</label><input class="input" id="memail" name="email" type="email" required></div>
                <button class="btn btn-primary">Add &amp; invite</button>
            </form>
        </section>

        <section sec:authorize="hasAuthority('CLAIM_FLAG_PRIORITY')" class="card p-4 space-y-3" aria-labelledby="tprio-title">
            <h2 id="tprio-title" class="font-semibold">Team priority</h2>
            <p class="text-sm text-slate-600">All of this team's claims go to the top of every queue with a shorter target time.</p>
            <form th:unless="${t.priority()}" th:action="@{/teams/{id}/priority(id=${t.id()})}" method="post" class="flex flex-wrap gap-2 items-end">
                <input type="hidden" name="priority" value="true">
                <div class="grow"><label class="label" for="treason">Reason</label><input class="input" id="treason" name="reason" required></div>
                <button class="btn btn-danger">Mark team as priority</button>
            </form>
            <form th:if="${t.priority()}" th:action="@{/teams/{id}/priority(id=${t.id()})}" method="post">
                <input type="hidden" name="priority" value="false"><button class="btn btn-ghost">Remove team priority</button>
            </form>
        </section>
    </div>

    <section class="card" aria-labelledby="claims-title">
        <h2 id="claims-title" class="px-4 pt-4 font-semibold">Claims</h2>
        <p th:if="${claims.isEmpty()}" class="p-4 text-sm text-slate-500">No claims yet.</p>
        <ul class="divide-y mt-2">
            <li th:each="c : ${claims}"><a th:href="@{/claims/{id}(id=${c.id()})}" class="flex justify-between gap-3 px-4 py-3 hover:bg-slate-50">
                <span><span class="font-medium" th:text="${c.publicCode()}"></span> <span class="text-sm text-slate-500" th:text="'· ' + ${c.vendorName()} + ' · ' + ${c.categoryName()}"></span></span>
                <span class="text-right"><span class="font-semibold" th:text="${@fmt.inr(c.claimedAmount())}"></span> <span th:replace="~{fragments/layout :: status(${c.status()})}"></span></span>
            </a></li>
        </ul>
    </section>
</main>
</body>
</html>
