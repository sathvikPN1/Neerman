<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Screen 07 of the design handoff: staff verification queue. Markup follows design.html, section "07 Verification queue". -->
<head th:replace="~{fragments/shell :: head('Verification queue')}"></head>
<body th:replace="~{fragments/shell :: page('verify', ~{::#content})}">
<div id="content" style="display:contents">

    <div class="page-head">
        <div><h1 class="page-title">Verification queue</h1>
            <span class="text-muted" th:text="${rows.size()} + ' to check · priority first · oldest next'">5 to check · priority first · oldest next</span></div>
    </div>

    <form method="get" class="form-grid-sm" aria-label="Filters">
        <div class="field"><label for="status">Status</label>
            <select class="input" id="status" name="status">
                <option value="">Submitted (default)</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label()}" th:selected="${filter.status() == s}"></option>
            </select></div>
        <div class="field"><label for="teamId">Team</label>
            <select class="input" id="teamId" name="teamId"><option value="">All teams</option>
                <option th:each="t : ${teams}" th:value="${t.id()}" th:text="${t.name()}" th:selected="${filter.teamId() == t.id()}"></option></select></div>
        <div class="field"><label for="cohortId">Cohort</label>
            <select class="input" id="cohortId" name="cohortId"><option value="">All cohorts</option>
                <option th:each="c : ${cohorts}" th:value="${c.id()}" th:text="${c.name()}" th:selected="${filter.cohortId() == c.id()}"></option></select></div>
        <div class="field"><label for="categoryId">Category</label>
            <select class="input" id="categoryId" name="categoryId"><option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.name()}" th:selected="${filter.categoryId() == c.id()}"></option></select></div>
        <div class="field"><label for="minAgeDays">Waiting at least</label>
            <select class="input" id="minAgeDays" name="minAgeDays"><option value="">Any time</option>
                <option th:each="d : ${ {2, 5, 10} }" th:value="${d}" th:text="${d} + ' days'" th:selected="${filter.minAgeDays() == d}"></option></select></div>
        <button class="btn btn-secondary btn-md"><i class="icon-filter" aria-hidden="true"></i>Apply</button>
    </form>

    <div class="list">
        <div th:if="${rows.isEmpty()}" class="empty"><i class="icon-circle-check" style="font-size:28px;color:var(--color-accent)" aria-hidden="true"></i>
            <b>Nothing waiting here.</b><span class="muted-sm">New submissions appear automatically, priority claims first.</span></div>
        <a th:each="r : ${rows}" th:href="@{/claims/{id}(id=${r.id()})}" class="list-row row-link" th:classappend="${r.priority()} ? 'edge-priority'">
            <div style="flex:1 1 240px;display:flex;flex-direction:column;gap:3px;min-width:0">
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                    <span style="font:500 13px 'JetBrains Mono'" th:text="${r.publicCode()}">NRM-2026-00003</span>
                    <span th:if="${r.priority()}" class="tag tag-priority" style="padding:1px 7px">Priority</span>
                    <span th:if="${r.priorityRequested()}" class="tag tag-warn">Priority requested</span>
                    <th:block th:if="${r.status().name() != 'SUBMITTED'}"><span th:replace="~{fragments/shell :: status(${r.status()})}"></span></th:block>
                </div>
                <span style="font-weight:600" th:text="${r.teamName()} + ' · ' + ${r.vendorName()}">MedTrack · Autodesk India</span>
                <span class="muted-sm" th:text="${r.categoryName()} + ' · ' + ${r.cohortName()} + ' · waiting ' + ${@fmt.age(r.stageEnteredAt())}">Software · Cohort 2026-A · waiting 2 days</span>
            </div>
            <span class="amount" th:text="${@fmt.inr(r.claimedAmount())}">₹12,999.00</span>
            <span class="btn btn-secondary" style="min-height:40px">Review<i class="icon-chevron-right" aria-hidden="true"></i></span>
        </a>
    </div>
</div>
</body>
</html>
