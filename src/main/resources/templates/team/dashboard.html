<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My team')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main" class="max-w-6xl mx-auto px-4 py-6 space-y-6">
    <div th:replace="~{fragments/flash :: flash}"></div>
    <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-semibold" th:text="${team.summary().name()}">Team</h1>
            <p class="text-sm text-slate-600">
                <span th:text="${team.summary().program().label()}">Pratham</span> ·
                <span th:text="${team.summary().cohortName()}">Cohort</span>
            </p>
        </div>
        <a th:href="@{/claims/new}" class="btn btn-primary">+ New claim</a>
    </div>

    <div th:replace="~{fragments/budget :: meter(${team.summary().budget()}, 'Your budget')}"></div>

    <p class="text-sm text-slate-600">Nirmaan funding is seed money, not a grant: spend on approved items first, then claim reimbursement here with the invoice and payment proof.
        <a th:href="@{/categories}" class="text-indigo-700 underline">What can I claim?</a></p>

    <section class="card" aria-labelledby="claims-title">
        <h2 id="claims-title" class="px-4 pt-4 font-semibold">Claims</h2>
        <div th:if="${claims.isEmpty()}" class="p-8 text-center text-slate-600">
            <p>No claims yet.</p>
            <a th:href="@{/claims/new}" class="btn btn-primary mt-3">Create your first claim</a>
        </div>
        <ul th:unless="${claims.isEmpty()}" class="divide-y divide-slate-200 mt-2">
            <li th:each="c : ${claims}">
                <a th:href="${c.status().isEditableByTeam()} ? @{/claims/{id}/edit(id=${c.id()})} : @{/claims/{id}(id=${c.id()})}"
                   class="flex items-center justify-between gap-3 px-4 py-3 hover:bg-slate-50">
                    <div class="min-w-0">
                        <p class="font-medium truncate"><span th:text="${c.vendorName()}">Vendor</span>
                            <span class="text-slate-500 text-sm" th:text="'· ' + ${c.categoryName()}"></span></p>
                        <p class="text-xs text-slate-500"><span th:text="${c.publicCode()}">NRM</span> · <span th:text="${@fmt.date(c.expenseDate())}"></span></p>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="font-semibold" th:text="${@fmt.inr(c.approvedAmount() ?: c.claimedAmount())}">₹</p>
                        <span th:replace="~{fragments/layout :: status(${c.status()})}"></span>
                        <th:block th:if="${c.priority()}"><span th:replace="~{fragments/layout :: priority}"></span></th:block>
                    </div>
                </a>
            </li>
        </ul>
    </section>

    <section class="card p-4" aria-labelledby="members-title">
        <h2 id="members-title" class="font-semibold">Team members</h2>
        <ul class="mt-2 text-sm text-slate-700">
            <li th:each="m : ${team.members()}" th:text="${m.name()} + ' — ' + ${m.email()}"></li>
        </ul>
    </section>
</main>
</body>
</html>
