<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Screen 16 of the design handoff: one person's permissions, each with an optional last day. -->
<head th:replace="~{fragments/shell :: head(${user.name()})}"></head>
<body th:replace="~{fragments/shell :: page('staff', ~{::#content})}">
<div id="content" style="display:contents">
<div class="page-narrow" style="width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px">
    <div><a th:href="@{/admin/staff}" style="font-size:14px">← Staff</a>
        <h1 class="page-title" style="margin-top:2px" th:text="${user.name()}">Rahul Menon</h1>
        <span class="text-muted" th:text="${user.email()} + ' · ' + ${user.role().label()}">rahul.menon@nirmaan.iitm.ac.in · Nirmaan staff</span></div>

    <form th:action="@{/admin/staff/{id}/permissions(id=${user.id()})}" method="post" style="display:flex;flex-direction:column;gap:16px">
        <p class="hint" style="margin:0">Tick what this person may do. A last day (inclusive) makes the permission end on its own, e.g. approving claims while the COO is on leave. Managing staff belongs to the COO only.</p>
        <div th:each="g : ${ {{'Claims', grantable.?[name().startsWith('CLAIM_') or name() == 'PREAPPROVAL_DECIDE']},
                              {'Money', grantable.?[name() == 'PAYMENT_RECORD' or name().startsWith('BANK_')]},
                              {'Setup', grantable.?[!(name().startsWith('CLAIM_') or name() == 'PREAPPROVAL_DECIDE' or name() == 'PAYMENT_RECORD' or name().startsWith('BANK_'))]}} }"
             class="blueprint" style="background:#fff;padding:16px;display:flex;flex-direction:column;gap:4px">
            <th:block th:replace="~{fragments/shell :: corners}"></th:block>
            <span class="card-kicker" style="margin-bottom:6px" th:text="${g[0]}">Claims</span>
            <div th:each="p : ${g[1]}" style="display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 0;min-height:44px;border-bottom:1px solid var(--color-neutral-200)">
                <label style="display:flex;gap:12px;align-items:flex-start;font-size:14px;flex:1 1 260px">
                    <input type="checkbox" name="perm" th:value="${p}" th:checked="${held.contains(p)}" style="width:20px;height:20px;margin-top:1px;flex:none">
                    <span style="display:flex;flex-direction:column"><b th:text="${p.description()}">Verify claims</b><span class="text-muted mono" style="font-size:12px" th:text="${p}">CLAIM_VERIFY</span></span></label>
                <div style="display:flex;gap:6px;align-items:center;font-size:13px">
                    <label class="text-muted" th:for="'exp-' + ${p}">Last day</label>
                    <input class="input" type="date" style="min-height:36px;width:auto" th:id="'exp-' + ${p}" th:name="'expires_' + ${p}" th:value="${expiry[p.name()]}" th:min="${@fmt.today()}">
                </div>
            </div>
        </div>
        <button class="btn btn-primary btn-lg">Save permissions</button>
    </form>

    <div class="panel" style="flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between">
        <div style="display:flex;flex-direction:column"><b th:text="${user.active()} ? 'Deactivate account' : 'Reactivate account'">Deactivate account</b>
            <span class="muted-sm" th:text="${user.active()} ? 'They are signed out at once and can no longer sign in.' : 'They can sign in again with their existing permissions.'"></span></div>
        <form th:if="${user.active()}" th:action="@{/admin/staff/{id}/deactivate(id=${user.id()})}" method="post" onsubmit="return confirm('Deactivate this user?')">
            <button class="btn btn-secondary danger-text btn-lg">Deactivate account</button></form>
        <form th:unless="${user.active()}" th:action="@{/admin/staff/{id}/reactivate(id=${user.id()})}" method="post">
            <button class="btn btn-secondary btn-lg">Reactivate account</button></form>
    </div>
</div>
</div>
</body>
</html>
