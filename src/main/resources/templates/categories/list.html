<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Screen 14 of the design handoff: expense categories and their rules. Markup follows design.html, section "14 Categories". -->
<head th:replace="~{fragments/shell :: head('Categories')}"></head>
<body th:replace="~{fragments/shell :: page('categories', ~{::#content})}">
<div id="content" style="display:contents">

    <div class="page-head">
        <div><h1 class="page-title">Categories</h1>
            <span class="text-muted">From the Nirmaan Student Guide. Every claim needs a real invoice (not pro-forma), a payment proof and a justification.</span></div>
    </div>

    <div class="list">
        <details th:each="c : ${categories}" class="expand" style="border-bottom:1px solid var(--color-neutral-200)" th:styleappend="${!c.active()} ? 'opacity:.6'">
            <summary style="display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:14px 16px">
                <i th:class="${c.allowed()} ? 'icon-circle-check' : 'icon-ban'" th:style="'font-size:20px;color:' + (${c.allowed()} ? 'var(--color-accent)' : '#A3212B')" aria-hidden="true"></i>
                <div style="flex:1 1 200px;display:flex;flex-direction:column;min-width:0"><b th:text="${c.name()}">Components &amp; materials</b>
                    <span class="text-muted" style="font-size:13px" th:text="${c.description()}">Tax invoice required</span></div>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                    <span th:unless="${c.allowed()}" class="tag" style="background:#FBE4E5;color:#A3212B">Not reimbursable</span>
                    <span th:if="${c.requiresPreApproval()}" class="tag tag-warn">Pre-approval required</span>
                    <span th:if="${c.preApprovalRecommended()}" class="tag tag-accent">Pre-approval recommended</span>
                    <span th:if="${c.justificationRequired()}" class="tag tag-muted">Detailed justification</span>
                    <span class="tag" th:classappend="${c.active()} ? 'tag-accent' : 'tag-muted'" th:text="${c.active()} ? 'Active' : 'Inactive'">Active</span>
                </div>
                <span sec:authorize="hasAuthority('CATEGORY_MANAGE')" class="btn btn-ghost btn-icon" aria-hidden="true"><i class="icon-pencil"></i></span>
            </summary>
            <div sec:authorize="hasAuthority('CATEGORY_MANAGE')" style="padding:0 16px 16px">
                <form th:replace="~{categories/list :: categoryForm(${c})}"></form>
            </div>
        </details>
    </div>

    <section sec:authorize="hasAuthority('CATEGORY_MANAGE')" class="blueprint" style="padding:16px;background:#fff;display:flex;flex-direction:column;gap:4px">
        <th:block th:replace="~{fragments/shell :: corners}"></th:block>
        <span class="card-title">New category</span>
        <form th:replace="~{categories/list :: categoryForm(null)}"></form>
    </section>
</div>

<form th:fragment="categoryForm(c)" th:action="@{/categories}" method="post" style="display:flex;flex-direction:column;gap:12px;margin:8px 0 0"
      th:with="p=${c == null ? 'new' : c.id()}">
    <input type="hidden" name="id" th:value="${c?.id()}">
    <div class="form-grid">
        <div class="field"><label th:for="'name-' + ${p}">Name</label><input class="input" th:id="'name-' + ${p}" name="name" th:value="${c?.name()}" required></div>
        <div class="field" style="max-width:160px"><label th:for="'sort-' + ${p}">Sort order</label><input class="input" th:id="'sort-' + ${p}" name="sortOrder" type="number" th:value="${c?.sortOrder() ?: 0}"></div>
    </div>
    <div class="field"><label th:for="'desc-' + ${p}">Rule shown to teams</label>
        <textarea class="input" th:id="'desc-' + ${p}" name="description" required style="min-height:72px" th:text="${c?.description()}"></textarea></div>
    <div style="display:flex;flex-wrap:wrap;gap:4px 20px">
        <label class="check" style="min-height:36px;align-items:center"><input type="checkbox" name="allowed" value="true" th:checked="${c == null or c.allowed()}">Reimbursable</label>
        <label class="check" style="min-height:36px;align-items:center"><input type="checkbox" name="requiresPreApproval" value="true" th:checked="${c?.requiresPreApproval()}">Requires pre-approval</label>
        <label class="check" style="min-height:36px;align-items:center"><input type="checkbox" name="preApprovalRecommended" value="true" th:checked="${c?.preApprovalRecommended()}">Pre-approval recommended</label>
        <label class="check" style="min-height:36px;align-items:center"><input type="checkbox" name="justificationRequired" value="true" th:checked="${c?.justificationRequired()}">Detailed justification</label>
        <label class="check" style="min-height:36px;align-items:center"><input type="checkbox" name="active" value="true" th:checked="${c == null or c.active()}">Active</label>
    </div>
    <button class="btn btn-primary btn-md" style="align-self:flex-start">Save category</button>
</form>
</body>
</html>
