# docker compose up --build
# App: http://localhost:8080   MailHog: http://localhost:8025   MinIO console: http://localhost:9001
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nirmaan
      POSTGRES_USER: nirmaan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nirmaan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirmaan -d nirmaan"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nirmaan}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nirmaan-secret}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/nirmaan
      DB_USER: nirmaan
      DB_PASSWORD: ${DB_PASSWORD:-nirmaan}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      MAIL_MODE: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nirmaan-claims
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nirmaan}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-nirmaan-secret}
      # First COO account, created only when no COO exists yet. Change these for any real deployment.
      BOOTSTRAP_COO_EMAIL: ${BOOTSTRAP_COO_EMAIL:-coo@nirmaan.local}
      BOOTSTRAP_COO_NAME: ${BOOTSTRAP_COO_NAME:-Anita Subramanian}
      BOOTSTRAP_COO_PASSWORD: ${BOOTSTRAP_COO_PASSWORD:-Demo@1234}
      # Seed demo staff, teams and claims. Set to false for production.
      DEMO_DATA: ${DEMO_DATA:-true}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
  miniodata:
